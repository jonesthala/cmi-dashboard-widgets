<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CMI Status</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  width: 100%;
  height: 100%;
  font-family: Arial, sans-serif;
  background: white;
}

a.widget {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 8px;
  text-decoration: none;
  cursor: pointer;
  transition: background 0.15s;
}
a.widget:hover { background: #f5f5f5; }

.dot {
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: #ccc;
}

.status-text {
  font-size: 14px;
  font-weight: bold;
  color: #333;
}

.sub {
  font-size: 11px;
  color: #aaa;
}
</style>
</head>
<body>
<a class="widget" href="https://status.cmicloud.ch" target="_blank">
  <div class="dot" id="dot"></div>
  <span class="status-text" id="text">Lädt…</span>
  <span class="sub" id="sub">CMI Cloud Status</span>
</a>

<script>
async function load() {
  try {
    const res = await fetch("https://corsproxy.io/?" + encodeURIComponent("https://status.cmicloud.ch/v3/summary.json"));
    const summary = await res.json();

    const isUp = summary.page.status === "UP";
    const hasIncident = summary.activeIncidents && summary.activeIncidents.length > 0;
    const hasMaint = summary.activeMaintenances && summary.activeMaintenances.length > 0;

    let color = "#1a9e4a";
    let text = "Alle Systeme OK";
    let sub = "CMI Cloud Status";

    if (hasIncident) { color = "#e07800"; text = "Störung aktiv"; }
    if (!isUp)        { color = "#d32f2f"; text = "Problem erkannt"; }
    if (isUp && !hasIncident && hasMaint) { sub = "🔧 Wartung geplant"; }

    document.getElementById("dot").style.background = color;
    document.getElementById("text").textContent = text;
    document.getElementById("text").style.color = color;
    document.getElementById("sub").textContent = sub;
  } catch {
    document.getElementById("dot").style.background = "#ccc";
    document.getElementById("text").textContent = "Status unbekannt";
  }
}

load();
setInterval(load, 60000);
</script>
</body>
</html>
