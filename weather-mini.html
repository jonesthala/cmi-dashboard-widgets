<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CMI Wetter</title>
<style>
html, body {
  margin: 0;
  height: 100%;
  font-family: Arial, sans-serif;
  background: #009fe3;
  color: white;
}
.widget {
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
}
.card {
  text-align: center;
}
.city {
  font-size: 14px;
  opacity: 0.85;
  margin-bottom: 2px;
}
.temp {
  font-size: 36px;
  font-weight: bold;
  margin: 4px 0;
  line-height: 1;
}
.desc {
  font-size: 13px;
  opacity: 0.9;
}
.error {
  font-size: 11px;
  opacity: 0.75;
  margin-top: 4px;
}
</style>
</head>
<body>
<div class="widget">
  <div class="card">
    <div class="city" id="city">Standort wird ermittelt…</div>
    <div class="temp" id="temp">--°C</div>
    <div class="desc" id="desc"></div>
    <div class="error" id="error"></div>
  </div>
</div>
<script>
function weatherCodeToText(code) {
  if (code === 0 || code === 1) return "Klar";
  if (code === 2) return "Teilweise bewölkt";
  if (code === 3) return "Bewölkt";
  if (code === 45 || code === 48) return "Neblig";
  if (code >= 51 && code <= 57) return "Nieselregen";
  if (code >= 61 && code <= 67) return "Regen";
  if (code >= 71 && code <= 77) return "Schnee";
  if (code >= 80 && code <= 82) return "Regenschauer";
  if (code >= 95 && code <= 99) return "Gewitter";
  return "–";
}

async function loadWeather(lat, lon, cityName) {
  try {
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code&timezone=auto`;
    const res = await fetch(url);
    const data = await res.json();
    const temp = Math.round(data.current.temperature_2m);
    const desc = weatherCodeToText(data.current.weather_code);
    document.getElementById("temp").textContent = temp + "°C";
    document.getElementById("desc").textContent = desc;
    document.getElementById("city").textContent = cityName;
  } catch (e) {
    document.getElementById("desc").textContent = "Fehler beim Laden";
  }
}

async function getCityName(lat, lon) {
  try {
    const res = await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json&zoom=10`);
    const data = await res.json();
    return data.address?.city || data.address?.town || data.address?.village || data.address?.county || "Standort";
  } catch {
    return "Standort";
  }
}

function init() {
  if (!navigator.geolocation) {
    // Fallback: Zürich
    document.getElementById("city").textContent = "Zürich";
    loadWeather(47.3769, 8.5417, "Zürich");
    return;
  }
  navigator.geolocation.getCurrentPosition(
    async (pos) => {
      const { latitude, longitude } = pos.coords;
      const city = await getCityName(latitude, longitude);
      loadWeather(latitude, longitude, city);
    },
    () => {
      // Kein Zugriff → Fallback Zürich
      loadWeather(47.3769, 8.5417, "Zürich");
    },
    { timeout: 5000 }
  );
}

init();
</script>
</body>
</html>
