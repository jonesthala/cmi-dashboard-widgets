<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CMI Wetter</title>
<style>
html, body {
  margin: 0;
  height: 100%;
  font-family: Arial, sans-serif;
  background: #009fe3;
  color: white;
}
.widget {
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
}
.card {
  text-align: center;
}
.city-wrap {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  margin-bottom: 2px;
}
.city {
  font-size: 14px;
  opacity: 0.85;
}
.edit-btn {
  font-size: 11px;
  opacity: 0.6;
  cursor: pointer;
  user-select: none;
}
.edit-btn:hover { opacity: 1; }
#city-input-wrap {
  display: none;
  flex-direction: column;
  align-items: center;
  gap: 5px;
  margin-bottom: 6px;
}
#city-input {
  border: none;
  border-radius: 4px;
  padding: 4px 10px;
  font-size: 13px;
  outline: none;
  text-align: center;
  width: 150px;
  color: #333;
}
.btn-row {
  display: flex;
  gap: 6px;
}
#city-input-wrap button {
  border: none;
  border-radius: 4px;
  padding: 3px 12px;
  font-size: 12px;
  cursor: pointer;
  background: rgba(255,255,255,0.25);
  color: white;
}
#city-input-wrap button:hover { background: rgba(255,255,255,0.4); }
.temp {
  font-size: 36px;
  font-weight: bold;
  margin: 4px 0;
  line-height: 1;
}
.desc {
  font-size: 13px;
  opacity: 0.9;
}
</style>
</head>
<body>
<div class="widget">
  <div class="card">
    <div class="city-wrap">
      <span class="city" id="city">Standort wird ermittelt…</span>
      <span class="edit-btn" onclick="showInput()" title="Standort ändern">✎</span>
    </div>
    <div id="city-input-wrap">
      <input id="city-input" type="text" placeholder="Stadt eingeben…" onkeydown="if(event.key==='Enter')saveCity()">
      <div class="btn-row">
        <button onclick="saveCity()">OK</button>
        <button onclick="hideInput()">✕</button>
      </div>
    </div>
    <div class="temp" id="temp">--°C</div>
    <div class="desc" id="desc"></div>
  </div>
</div>
<script>
function weatherCodeToText(code) {
  if (code === 0 || code === 1) return "Klar";
  if (code === 2) return "Teilweise bewölkt";
  if (code === 3) return "Bewölkt";
  if (code === 45 || code === 48) return "Neblig";
  if (code >= 51 && code <= 57) return "Nieselregen";
  if (code >= 61 && code <= 67) return "Regen";
  if (code >= 71 && code <= 77) return "Schnee";
  if (code >= 80 && code <= 82) return "Regenschauer";
  if (code >= 95 && code <= 99) return "Gewitter";
  return "–";
}

async function loadWeather(lat, lon, cityName) {
  try {
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code&timezone=auto`;
    const res = await fetch(url);
    const data = await res.json();
    document.getElementById("temp").textContent = Math.round(data.current.temperature_2m) + "°C";
    document.getElementById("desc").textContent = weatherCodeToText(data.current.weather_code);
    document.getElementById("city").textContent = cityName;
  } catch {
    document.getElementById("desc").textContent = "Fehler beim Laden";
  }
}

function showInput() {
  document.getElementById("city-input-wrap").style.display = "flex";
  document.getElementById("city-input").focus();
}

function hideInput() {
  document.getElementById("city-input-wrap").style.display = "none";
  document.getElementById("city-input").value = "";
}

async function saveCity() {
  const input = document.getElementById("city-input").value.trim();
  if (!input) return;
  hideInput();
  document.getElementById("city").textContent = "Lädt…";
  try {
    const res = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(input)}&count=1&language=de`);
    const data = await res.json();
    if (data.results && data.results[0]) {
      const r = data.results[0];
      localStorage.setItem("weather_lat", r.latitude);
      localStorage.setItem("weather_lon", r.longitude);
      localStorage.setItem("weather_city", r.name);
      loadWeather(r.latitude, r.longitude, r.name);
    } else {
      document.getElementById("city").textContent = "Stadt nicht gefunden";
    }
  } catch {
    document.getElementById("city").textContent = "Fehler";
  }
}

async function init() {
  // 1. Gespeicherten Standort prüfen
  const savedLat = localStorage.getItem("weather_lat");
  const savedLon = localStorage.getItem("weather_lon");
  const savedCity = localStorage.getItem("weather_city");
  if (savedLat && savedCity) {
    loadWeather(parseFloat(savedLat), parseFloat(savedLon), savedCity);
    return;
  }
  // 2. IP-basierte Erkennung
  try {
    const res = await fetch("https://ipapi.co/json/");
    const data = await res.json();
    if (data && data.latitude && data.city) {
      loadWeather(data.latitude, data.longitude, data.city);
    } else {
      loadWeather(47.3769, 8.5417, "Zürich");
    }
  } catch {
    loadWeather(47.3769, 8.5417, "Zürich");
  }
}

init();
</script>
</body>
</html>
