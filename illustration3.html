<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CMI Illustration</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: transparent;
}

.banner {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
}

.landscape {
  display: flex;
  width: 100%;
  height: 100%;
  gap: 0;
}

.landscape img {
  flex: 1;
  width: 50%;
  height: 100%;
  object-fit: cover;
  object-position: center 50%;
  display: block;
}

/* Fade oben: sehr minimal */
.banner::after {
  content: "";
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 8%;
  background: linear-gradient(to bottom, #f0f0f0 0%, transparent 100%);
  pointer-events: none;
}

/* Fade links und rechts */
.banner::before {
  content: "";
  position: absolute;
  inset: 0;
  background:
    linear-gradient(to right, #f0f0f0 0%, transparent 1.5%),
    linear-gradient(to left,  #f0f0f0 0%, transparent 1.5%);
  pointer-events: none;
  z-index: 1;
}
</style>
</head>
<body>
<div class="banner">
  <div class="landscape">
    <img src="CMI-Welt_Tag_RGB_Wall_1_ohne-Flags_2023.jpg" alt="CMI Landschaft links">
    <img src="cmi-illustration.jpg" alt="CMI Landschaft rechts">
  </div>
</div>
</body>
</html>
