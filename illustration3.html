<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CMI Illustration</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: transparent;
}

.banner {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  width: 100%;
  height: 100%;
}

.banner img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center bottom;
  display: block;
}

/* Fade oben: transparent → weiss, damit es sanft ins Dashboard übergeht */
.banner::after {
  content: "";
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 50%;
  background: linear-gradient(to bottom, #f5f5f5 0%, transparent 100%);
  pointer-events: none;
}
</style>
</head>
<body>
<div class="banner">
  <img src="cmi-illustration.jpg" alt="CMI Illustration">
</div>
</body>
</html>
